# CI gate (TECH 18): advisories and licenses. Bans and sources keep cargo-deny's defaults.
[advisories]
# the unmaintained/unsound notices are all transitive Tauri Linux (GTK, zbus) crates: no fix on our side, so only
# crates the workspace depends on directly can fail the check
unmaintained = "workspace"

[licenses]
# permissive licenses plus MPL-2.0 (file-level copyleft: cssparser, selectors); r-efi is `OR`, MIT applies
allow = ["0BSD", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "BSL-1.0", "CC0-1.0", "MIT", "MIT-0", "MPL-2.0", "Unicode-3.0", "Unlicense", "Zlib"]
