# FR-98 stage 1 (TECH 21.5): the core builds, lints and passes its tests on macOS and Linux for every pull request and
# push to main. Windows joins once the core has its Windows layer (stage 3). No secrets are used here.
# FR-98 stage 2: a second Ubuntu leg runs with bash (Ubuntu's default shell) — its login files replace PATH, which is a
# different pane hook path; plus the Linux .deb bundle on both architectures.
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            shell: /bin/zsh # the pane hooks (FR-58) under test
          - os: ubuntu-24.04
            shell: /bin/zsh
          - os: ubuntu-24.04
            shell: /bin/bash # the default shell on Ubuntu (FR-98 stage 2)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      SHELL: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test tools (Linux)
        if: runner.os == 'Linux'
        # the runner's zsh completion folders are group-writable: compinit then asks y/n and eats the first keystroke
        run: |
          sudo apt-get update -q && sudo apt-get install -yq zsh vim netcat-openbsd
          zsh -c 'autoload -U compaudit; compaudit' | xargs -r sudo chmod go-w
      - run: cargo clippy -q -p gembala --all-targets -- -D warnings
      - run: cargo test -q -p gembala
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - working-directory: ui
        run: npm ci --ignore-scripts && npm run check && npm test
  bundle-linux:
    # FR-98 stage 2: the bundle has to build on both architectures. Ubuntu 22.04 keeps the glibc old enough to run on
    # newer distros. Artifacts only; the release matrix is stage 6.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build dependencies
        # libdbus-1-dev: SEC-20 keyring (Secret Service) on Linux
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libxdo-dev libssl-dev file
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - working-directory: ui
        run: npm ci --ignore-scripts
      - working-directory: ui
        run: npm run tauri build -- --bundles deb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gembala-linux-${{ matrix.os }}
          path: target/release/bundle/deb/*.deb
          if-no-files-found: error
