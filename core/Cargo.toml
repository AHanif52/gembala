[package]
name = "gembala"
version = "0.1.0"
description = "Daemon PTY + CLI Gembala (satu binary)"
edition = "2024"

[dependencies]
base64 = "0.23.1"
hmac = "0.13.0"
libc = "0.2"
regex-lite = "0.1.9"
serde_json = "1.0.154"
sha2 = "0.11.1"
toml_edit = "0.25.17"
vt100 = "0.18.1"

# SEC-20: the UI channel is recognized by the peer's code signature (already in Cargo.lock through the UI app)
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
security-framework = "3.7.0"
